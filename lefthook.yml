# same scripts run in ci so skipping a hook only delays the failure
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,json,css,html,yml,yaml}'
      run: bunx prettier --check --ignore-unknown {staged_files}
    python:
      glob: 'apps/api/**/*.py'
      run: uv run --directory apps/api ruff format --check .
    slop:
      run: bun scripts/lint-slop.ts {staged_files}

commit-msg:
  commands:
    message:
      run: bun scripts/lint-commit-msg.ts {1}
