[project]
name = "corkathon-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask==3.1.3",
    "flask-jwt-extended==4.7.4",
    "flask-sqlalchemy==3.1.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "waitress==3.0.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "corkathon_api"
module-root = ""

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "types-waitress==3.0.1.20260724",
]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101", "S105", "S106"]
"conftest.py" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# flask-jwt-extended ships jwt_required without types
[[tool.mypy.overrides]]
module = "corkathon_api.features.*.routes"
disallow_untyped_decorators = false
