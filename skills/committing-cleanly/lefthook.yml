# copy to a repo root along with the two scripts in scripts/
# run the same scripts in ci so skipping a hook only delays the failure
pre-commit:
  parallel: true
  commands:
    slop:
      run: bun scripts/lint-slop.ts {staged_files}

commit-msg:
  commands:
    message:
      run: bun scripts/lint-commit-msg.ts {1}
