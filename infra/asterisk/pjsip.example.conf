; /etc/asterisk/pjsip.conf - template. install.sh copies it only when the Pi has no
; pjsip.conf yet, and swaps each CHANGE_ME_10xx for a random password.
; Never commit the real file: it holds every handset password.
;
; Asterisk listens on the Pi's private LAN only (eth0, 10.99.99.1), never on the wifi.
; 1001 = Cisco DBS-110 DECT handset, 1002 = Zoiper softphone (over Tailscale), 1003 to 1010 spare.

[transport-udp]
type=transport
protocol=udp
bind=10.99.99.1:5060

[endpoint-tpl](!)
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth-tpl](!)
type=auth
auth_type=userpass

[aor-tpl](!)
type=aor
max_contacts=1

[1001](endpoint-tpl)
auth=1001
aors=1001
[1001](auth-tpl)
username=1001
password=CHANGE_ME_1001
[1001](aor-tpl)

[1002](endpoint-tpl)
auth=1002
aors=1002
[1002](auth-tpl)
username=1002
password=CHANGE_ME_1002
[1002](aor-tpl)

