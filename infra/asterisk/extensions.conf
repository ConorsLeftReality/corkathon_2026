; /etc/asterisk/extensions.conf - installed by infra/asterisk/install.sh
; Handsets and softphones are 1001 to 1010 (pjsip.conf). 100 is the Dialed-In menu.

[internal]
exten => 100,1,Goto(dialed-in-menu,s,1)
; _10XX covers 1001 to 1010 (the old _100X pattern missed 1010)
exten => _10XX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; outbound calls placed by call_extension.py (morning review)
[autocall]
exten => s,1,Wait(2)
 same => n,Playback(${AUDIOFILE})
 same => n,Wait(2)
 same => n,Hangup()

#include dialed-in.conf
