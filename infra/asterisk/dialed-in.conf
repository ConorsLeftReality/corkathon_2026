; /etc/asterisk/dialed-in.conf - installed by infra/asterisk/install.sh
; Dial 100. The top menu picks a service; each service is its own context.
; To add a service (e.g. invoicing on 2):
;   1. add a context like [cro-tracker] below
;   2. add "exten => 2,1,Goto(invoicing,s,1)" to [dialed-in-menu]
;   3. update the main-menu prompt text in make_prompts.sh and rerun it with --force main-menu
; Prompts live in /srv/voip/prerendered_audio, made by make_prompts.sh (or your own recordings).

[dialed-in-menu]
exten => s,1,Answer()
 same => n,Wait(0.7)
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Set(LOOPS=0)
 same => n(menu),Set(LOOPS=$[${LOOPS} + 1])
 same => n,GotoIf($[${LOOPS} > 20]?bye)
 same => n,Background(/srv/voip/prerendered_audio/main-menu)
 same => n,WaitExten(30)
 same => n(bye),Playback(/srv/voip/prerendered_audio/goodbye)
 same => n,Hangup()

exten => 1,1,Goto(cro-tracker,s,1)

exten => i,1,Playback(/srv/voip/prerendered_audio/invalid)
 same => n,Goto(s,menu)

exten => t,1,Goto(s,menu)

; CRO Tracker: 1 ask a question, * back
[cro-tracker]
exten => s,1,Set(LOOPS=0)
 same => n(menu),Set(LOOPS=$[${LOOPS} + 1])
 same => n,GotoIf($[${LOOPS} > 20]?bye)
 same => n,Background(/srv/voip/prerendered_audio/menu)
 same => n,WaitExten(30)
 same => n(bye),Playback(/srv/voip/prerendered_audio/goodbye)
 same => n,Hangup()

exten => 1,1,Playback(/srv/voip/prerendered_audio/ask)
 same => n,Set(Q=/var/spool/asterisk/dialed-in/q-${UNIQUEID}.wav)
 same => n,Set(A=/srv/voip/answers/a-${UNIQUEID})
 same => n,Record(${Q},2,15,k)
 same => n,Playback(/srv/voip/prerendered_audio/one-moment)
 same => n,TrySystem(timeout 25 /usr/bin/python3 /opt/dialed-in/transcribe_audio.py ${Q} ${A} >> /var/spool/asterisk/dialed-in/log.txt 2>&1)
 same => n,GotoIf($["${SYSTEMSTATUS}" = "SUCCESS"]?ok)
 same => n,Playback(/srv/voip/prerendered_audio/sorry)
 same => n,Goto(s,menu)
 same => n(ok),Playback(${A})
 same => n,Goto(s,menu)

exten => *,1,Goto(dialed-in-menu,s,menu)

exten => i,1,Playback(/srv/voip/prerendered_audio/invalid)
 same => n,Goto(s,menu)

exten => t,1,Goto(s,menu)
