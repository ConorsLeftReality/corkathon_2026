name: ci

on:
  push:
    branches: [main]
  pull_request:

# nothing here needs to write, and a pr from a fork gets no secrets
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 on 2026-11-08
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 on 2026-11-08
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6 on 2026-11-08
      - run: bun install --frozen-lockfile
      - run: uv sync --directory apps/api --frozen
      - run: bunx playwright install --with-deps chromium
      - name: commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/lint-commit-msg.ts --range "origin/$BASE_REF..HEAD"
      - run: bun run check
      - name: keep playwright results when a test fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 on 2026-11-08
        with:
          name: playwright-results
          path: test-results
          retention-days: 3
